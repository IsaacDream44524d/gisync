<div class="notify-backdrop">


    <div class="notify-card" id="notification-modal">
        <div class="notify-header">
            <h2>Post Notification</h2>
            <p>Send important updates and announcements to GIS Class.</p>
        </div>

        <form class="notify-form">

            <div class="form-group">
                <label>Notification Type</label>

                <div class="input-icon">
                    <div class="input-icon-left">
                        <span class="notify-type-icon">
                            <i class="bi bi-megaphone-fill"></i>
                        </span>

                        <select>
                            <option>General Announcement</option>
                            <option>Academic Update</option>
                            <option>Event Reminder</option>
                            <option>Important Notice</option>
                            <option>Urgent Alert</option>
                        </select>
                    </div>
                </div>
            </div>



            <div class="form-group">
                <label>Message</label>
                <textarea rows="8" placeholder="Write your notification..."></textarea>
            </div>

            <div class="form-group">
                <label>Delivery Options</label>

                <div class="option-list">
                    <label class="option-item">
                        <input type="checkbox">
                        <span>Send email notification to all users</span>
                    </label>

                    <label class="option-item">
                        <input type="checkbox" checked>
                        <span>Pin this notification to the dashboard</span>
                    </label>
                </div>
            </div>



            <div class="form-action">
               

                <button style="height: 40px;" type="button" class="btn btn-outline cancel-btn">
                    Cancel
                </button>

                 <button style="height: 40px;" type="submit" class="btn btn-primary publish-btn">
                    <i class="bi bi-send"></i>
                    Publish Notification
                </button>
            </div>

        </form>
    </div>

</div>
