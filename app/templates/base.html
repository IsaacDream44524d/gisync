<!DOCTYPE html>
<html lang="en">

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  <script>

<!-- move style -->
<style>
  .user-menu {
    position: absolute;
    right: 0;
    top: calc(100% + 6px);
    min-width: 200px;
    background: var(--bg-surface, #fff);
    border: 1px solid var(--border-color, #ddd);
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, .08);
    display: none;
    z-index: 1000;
    overflow: hidden;
  }

  .user-menu.show {
    display: block;
  }

  .user-menu a,
  .user-menu button {
    width: 100%;
    padding: 12px 16px;
    border: none;
    background: none;
    text-align: left;
    font: inherit;
    cursor: pointer;
    display: block;
    text-decoration: none;
    color: inherit;
  }

  .user-menu a:hover,
  .user-menu button:hover {
    background: rgba(0, 0, 0, .05);
    text-decoration: none;
  }

  .user-menu form {
    margin: 0;
  }

  .user-menu .danger {
    color: #dc2626;
  }

  .opt-btn {
    width: 26px;
    height: 26px;
    border: none;
    background: transparent;
    border-radius: var(--radius-sm);
    cursor: pointer;
    color: var(--text-muted);
    display: flex;
    overflow: hidden;
    transition: background 100ms, color 100ms;
    margin-bottom: 10px;
    position: absolute;
  }

  .opt-btn:hover {
    background: var(--body-bg);
    color: var(--text-secondary);
  }

  .opt-btn svg {
    width: 14px;
    height: 14px;
  }

  .upload-modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, .45);
    display: none;
    justify-content: center;
    align-items: center;
    padding: 16px;
    z-index: 1000;
  }

  .upload-modal-overlay.show {
    display: flex;
  }

  .upload-modal {
    width: 100%;
    max-width: 700px;
    max-height: 90vh;
    background: #fff;
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 50px rgba(0, 0, 0, .15);
  }

  .upload-header {
    padding: 24px;
    border-bottom: 1px solid #e5e7eb;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .upload-header h3 {
    margin: 0;
    font-size: 1.2rem;
  }

  .close-btn {
    border: none;
    background: none;
    font-size: 28px;
    cursor: pointer;
    line-height: 1;
  }

  .upload-body {
    padding: 24px;
    overflow-y: auto;
  }

  .dropzone {
    border: 2px dashed #d1d5db;
    border-radius: 12px;
    padding: 60px 20px;
    text-align: center;
    cursor: pointer;
    transition: .2s;
  }

  .dropzone:hover {
    border-color: #10b981;
  }

  .dropzone.dragover {
    border-color: #10b981;
    background: #f0fdf4;
  }

  .upload-icon {
    font-size: 48px;
    margin-bottom: 10px;
  }

  #selectedFile {
    margin-top: 16px;
    font-weight: 500;
    word-break: break-word;
  }

  .upload-footer {
    padding: 20px 24px;
    border-top: 1px solid #e5e7eb;
    display: flex;
    justify-content: flex-end;
    gap: 12px;
  }

  .btn-primary,
  .btn-secondary {
    padding: 12px 18px;
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
  }

  .btn-primary {
    background: #10b981;
    color: white;
    border: none;
  }

  .btn-secondary {
    background: white;
    border: 1px solid #d1d5db;
  }

  /* Tablet */
  @media (max-width: 768px) {

    .upload-header,
    .upload-body,
    .upload-footer {
      padding: 18px;
    }

    .dropzone {
      padding: 40px 16px;
    }

    .upload-icon {
      font-size: 40px;
    }
  }

  /* Mobile */
  @media (max-width: 60rem) {
    .upload-modal {
      max-height: 95vh;
      border-radius: 12px;
    }

    .upload-header h3 {
      font-size: 1rem;
    }

    .dropzone {
      padding: 32px 12px;
    }

    .upload-icon {
      font-size: 32px;
    }

    .btn-primary,
    .btn-secondary {
      width: fit-content;
    }

  }

  .import-result {
    margin-bottom: 16px;
    padding: 14px 16px;
    border-radius: 10px;
    border: 1px solid;
    font-size: .95rem;
  }

  .import-result.hidden {
    display: none;
  }

  .import-result.success {
    background: #ecfdf5;
    border-color: #bbf7d0;
    color: #166534;
  }

  .import-result.error {
    background: #fef2f2;
    border-color: #fecaca;
    color: #991b1b;
  }

  .import-result ul {
    margin-top: 10px;
    padding-left: 20px;
  }

  .import-result li {
    margin-bottom: 4px;
  }

  .skeleton.hidden {
    display: none;
  }
</style>

<body data-shell="admin" data-page="dashboard" data-breadcrumb="Home > Dashboard">

  {% if current_view == 'student' %}

  {% include 'partials/student_nav.html' %}

  {% endif %}


  {% block content %}

  {% endblock %}




  <script>


    //modal
    const inviteModal = document.getElementById("inviteModal");


    document.getElementById("invite-btn").addEventListener("click", () => {
      inviteModal.classList.add("show");
    });

    function closeInviteModal() {
      inviteModal.classList.remove("show");
    }

    document.getElementById("closeInviteBtn")
      .addEventListener("click", closeInviteModal);

    document.getElementById("cancelInviteBtn")
      .addEventListener("click", closeInviteModal);

    inviteModal.addEventListener("click", (e) => {
      if (e.target === inviteModal) {
        closeInviteModal();
      }
    });

    function closeModal() {
      modal.classList.remove("show");
    }

    //invite modal
    const form = document.getElementById('invite-form')
    form.addEventListener('submit', async (e) => {

      e.preventDefault();

      const inviteForm = new FormData(form);

      closeInviteModal();
      inviteStudents(inviteForm);

    });

    let table = document.querySelector('.table');
    let skeletonLoader = document.querySelector('.skeleton');
    const importResult = document.getElementById('importResult');

    (function () {
      if (!table || !skeletonLoader) {
        table = document.querySelector('.mock-table');
        skeletonLoader = document.querySelector('.mock-skeleton')
      };
    })();

    function showImportResult(type, message, errors = []) {
      importResult.className = `import-result ${type}`;

      importResult.innerHTML = `
  <strong>${message}</strong>
  ${errors.length
          ? `
              <ul>
                  ${errors.map(error => `<li>${error}</li>`).join('')}
              </ul>
              `
          : ''
        }
`;

      importResult.classList.remove('hidden');

      importResult.scrollIntoView({
        behavior: 'smooth',
        block: 'start'
      });
    }

    function importStudents(formData) {

      // Reset previous messages
      importResult.classList.add('hidden');
      importResult.innerHTML = '';

      // Show skeleton
      table.style.display = 'none';
      skeletonLoader.classList.remove('hidden');

      fetch('/admin/resources/import', {
        method: 'POST',
        body: formData
      })
        .then(async (res) => {
          const data = await res.json();

          if (!res.ok) {
            showImportResult(
              'error',
              'Import failed',
              Array.isArray(data.error)
                ? data.error
                : [data.error || 'An unknown error occurred']
            );

            return;
          }

          showImportResult(
            'success',
            data.message || 'Import completed successfully',
            data.errors || []
          );


        })
        .catch((err) => {
          showImportResult(
            'error',
            'Import failed',
            [err.message]
          );
        })
        .finally(() => {
          skeletonLoader.classList.add('hidden');
          table.style.display = 'table';
        });
    }

    function inviteStudents(inviteForm) {

      // Reset previous messages
      importResult.classList.add('hidden');
      importResult.innerHTML = '';

      // Show skeleton
      table.style.display = 'none';
      skeletonLoader.classList.remove('hidden');


      fetch("{{ url_for('admin.inviteUser') }}", {
        method: 'POST',
        body: inviteForm,
        credentials: 'include'
      })
        .then(async (res) => {
          const data = await res.json();

          if (!res.ok) {

            let errors = [];

            if (Array.isArray(data.error)) {
              errors = data.error;
            } else if (typeof data.error === "object" && data.error !== null) {
              errors = Object.entries(data.error).flatMap(
                ([field, msgs]) =>
                  msgs.map(msg => `${field}: ${msg}`)
              );
            } else {
              errors = [data.error || "An unknown error occurred"];
            }

            showImportResult(
              "error",
              "Invite could not be sent.\nPlease fix the following error/s and try again",
              errors
            );


            return;
          }

          showImportResult(
            "success",
            data.message || "Invite completed successfully",
            data.errors || []
          );
        })
        .catch((err) => {
          showImportResult(
            "error",
            "Invite failed",
            [err.message]
          );
        })
        .finally(() => {
          skeletonLoader.classList.add("hidden");
          table.style.display = "table";

        });
    }

  </script>

</body>

</html>
