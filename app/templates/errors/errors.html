<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    {% if title %}
    <title> {{title}} | GISync</title>
    {% else %}

    <title>GISync</title>
    {% endif %} {{ vite.cssAsset }} {{ vite.jsAsset }}
</head>

<style>
    .error-page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--body-bg);
        text-align: center;
    }

    .error-content {
        max-width: 500px;
    }

    .error-code {
        font-size: 96px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: -3px;
        background: linear-gradient(135deg, var(--primary), var(--azure));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        margin-bottom: 8px;
    }

    .error-title {
        font-size: 22px;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 8px;
    }

    .error-message {
        font-size: 14px;
        color: var(--text-secondary);
        margin-bottom: 24px;
        line-height: 1.5;
    }

    .error-actions {
        display: flex;
        gap: var(--space-2);
        justify-content: center;
    }

    a:hover {
        text-decoration: none;
    }

    .status-page-meta {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--space-3);
        margin: 20px 0 24px;
        text-align: left;
        background: var(--bg-surface);
        border: 1px solid var(--border-color);
        border-radius: var(--radius);
        padding: 14px 16px;
    }

    .status-page-meta .meta-label {
        font-size: 10.5px;
        font-weight: var(--font-weight-bold);
        text-transform: uppercase;
        letter-spacing: 0.4px;
        color: var(--text-muted);
        margin-bottom: 2px;
    }

    .status-page-meta .meta-value {
        font-size: 13px;
        color: var(--text);
        font-weight: var(--font-weight-medium);
    }

    .status-page-icon {
    width: 80px;
    height: 80px;
    margin: 0 auto 16px;
    border-radius: 50%;
    background: var(--primary-lt);
    color: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
  }

</style>

<body data-shell="admin" data-page="dashboard" data-breadcrumb="Home > Dashboard">


    {% block error %}

    {% endblock %}

</body>

</html>
