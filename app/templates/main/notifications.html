{% extends 'base.html' %}

{% block content %}
<style>
  .notify-backdrop.show {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;
    background: rgba(15, 23, 42, .05);
    backdrop-filter: blur(1px);
    -webkit-backdrop-filter: blur(1px);
    overflow-y: auto;
    display: none;
  }

  .notify-backdrop.show {
    display: flex;
  }

  .notify-card {
    width: 100%;
    max-width: 600px;
    margin: auto;
    padding: 40px;
    display: none;
    background: #F5F7FB;
    border-radius: 24px;
    border: 1px solid var(--border-color);
    box-shadow:
      0 10px 40px rgba(15, 23, 42, .05),
      0 2px 8px rgba(15, 23, 42, .03);

    position: absolute;
    top: 80%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 9999;
    max-height: fit-content;
  }

  .notify-card.show {
    display: block;
  }

  .notify-header {
    margin-bottom: 32px;
  }

  .notify-header h2 {
    margin: 0;
    font-size: 2rem;
    font-weight: 700;
    color: var(--text);
    line-height: 1.2;
  }



  .notify-header p {
    margin-top: 8px;
    color: var(--text-muted);
    font-size: 1rem;
  }

  .notify-form {
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .form-group label {
    font-size: 1rem;
    font-weight: 600;
    color: var(--text);
  }

  .form-group input[type="text"],
  .form-group textarea,
  .form-group select {
    width: 100%;
    max-width: 100%;
    border: none;
    outline: none;
    background: transparent;
    font-size: 1rem;
    color: var(--text);
    font-family: inherit;
  }

  .form-group input[type="text"] {
    padding: 18px 20px;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 16px;
  }

  .form-group textarea {
    padding: 18px 20px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 16px;
    resize: vertical;
    min-height: 220px;
  }

  .form-group input[type="text"]:focus,
  .form-group textarea:focus {
    border-color: var(--accent);
  }

  .input-icon {
    border: 1px solid var(--border);
    border-radius: 16px;
    background: #fff;
    transition: .2s ease;
  }

  .input-icon:focus-within {
    border-color: var(--accent);
  }

  .input-icon-left {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 18px;
  }

  .input-icon-left>i {
    font-size: 1.2rem;
    color: #374151;
  }

  .notify-type-icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: var(--accent-bg);
    color: var(--primary, #04060b);

    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .notify-type-icon i {
    font-size: 1.15rem;
  }

  .input-icon select {
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;
  }

  .option-list {
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    background: #fff;
  }

  .option-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px;
    cursor: pointer;
  }

  .option-item+.option-item {
    border-top: 1px solid var(--border);
  }

  .option-item input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: var(--accent);
    flex-shrink: 0;
  }

  .option-item span {
    color: #374151;
    font-size: .98rem;
  }





  /* Tablet */
  @media (max-width:768px) {

    .notify-card {
      padding: 24px;
      border-radius: 20px;
    }

    .notify-header {
      margin-bottom: 24px;
    }

    .notify-header h2 {
      font-size: 1.7rem;
    }

    .notify-header p {
      font-size: .95rem;
    }

    .notify-form {
      gap: 22px;
    }

    .form-group {
      gap: 10px;
    }

    .input-icon-left {
      padding: 14px 16px;
    }

    .form-group input[type="text"],
    .form-group textarea {
      padding: 16px;
    }

    .form-group textarea {
      min-height: 180px;
    }

    .option-item {
      padding: 16px;
    }

    
  }

  /* Mobile */
  @media (max-width:480px) {

    .notify-card {
      padding: 16px;
      border-radius: 16px;
    }

    .notify-header {
      margin-bottom: 20px;
    }

    .notify-header h2 {
      font-size: 1.4rem;
    }

    .notify-header p {
      font-size: .9rem;
    }

    .notify-form {
      gap: 18px;
    }

    .notify-type-icon {
      width: 32px;
      height: 32px;
    }

    .notify-type-icon i {
      font-size: 1rem;
    }

    .input-icon-left {
      gap: 10px;
      padding: 12px 14px;
    }

    .form-group input[type="text"],
    .form-group textarea {
      font-size: .95rem;
    }

    .form-group textarea {
      min-height: 150px;
    }

    .option-item {
      padding: 14px;
    }

    .option-item span {
      font-size: .9rem;
    }

  
  }
</style>


<main class="main">
  {% if current_user.role.value == 'student' %}
    {% include 'partials/student_nav.html'   %}
  {% endif %}

  {% include 'partials/notification_modal.html' %}

  <div class="page-wrapper">

    <div class="page-header">
      <div class="page-header-row">
        <div>
          <div class="page-pretitle">Activity</div>
          <h1 class="page-title">Notifications</h1>
        </div>
        <div class="page-actions">
          <button class="btn btn-outline" id="notification-btn"><span
              style="font-size: 1.3rem; color:#E05A29; font-weight:bolder;">+</span>Post announcement</button>

        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header" style="border-bottom:1px solid var(--border-color-light)">
        <div class="chart-tabs notif-tabs" id="notif-tabs">
          <button class="chart-tab active" data-filter="all">All</button>
          <button class="chart-tab" data-filter="unread">Unread <span class="notif-tab-count"
              id="count-unread">0</span></button>
        </div>
      </div>

      <span class="skeleton hidden skeleton-rect" style="width:100%;height:100vh"></span>
      <div class="card-body" style="padding:0">
        <div class="notifications-list" id="notif-list">
          <!-- rendered by inline script -->
        </div>
        <div class="notifications-empty" id="notif-empty" hidden>
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M12 3a6 6 0 00-6 6c0 6-3 7-3 7h18s-3-1-3-7a6 6 0 00-6-6z" />
          </svg>
          <div class="empty-title">All caught up</div>
          <div class="empty-desc">No notifications match this filter.</div>
        </div>
      </div>
    </div>

  </div>
</main>

<script type="module">
  const notifications = [
    { id: 1, kind: 'info', cat: 'all', from: 'Stripe', text: 'Payment of $499.00 received from Acme Corp', time: '2 min ago', unread: true },
    { id: 2, kind: 'task', cat: 'reviews', from: 'GitHub', text: 'PR #248 ready for review on the analytics-pipeline repo', time: '14 min ago', unread: true },
    { id: 3, kind: 'alert', cat: 'all', from: 'Linear', text: 'GEN-128 marked as urgent — needs attention before EOD', time: '1 hour ago', unread: true },
    { id: 4, kind: 'mention', cat: 'mentions', from: 'Sarah K.', text: 'Mentioned you in a comment on "Q2 Marketing Campaign"', time: '2 hours ago', unread: true },
    { id: 5, kind: 'info', cat: 'all', from: 'Vercel', text: 'Deployment succeeded — gentelella-v4.vercel.app live in 28s', time: '3 hours ago', unread: false },
    { id: 6, kind: 'task', cat: 'reviews', from: 'GitHub', text: 'PR #246 was merged into main by Michael R.', time: '5 hours ago', unread: false },
    { id: 7, kind: 'mention', cat: 'mentions', from: 'Notion', text: 'You were mentioned in "Q2 OKRs" by Emily Wang', time: 'Yesterday', unread: false },
    { id: 8, kind: 'info', cat: 'all', from: 'Stripe', text: 'Subscription renewed — Pro plan $29 billed for May 2026', time: 'Yesterday', unread: false },
    { id: 9, kind: 'alert', cat: 'all', from: 'System', text: 'Scheduled maintenance window: April 30 02:00–04:00 UTC', time: '2 days ago', unread: false },
    { id: 10, kind: 'task', cat: 'reviews', from: 'Linear', text: 'GEN-129 assigned to you — fix table sort indicators', time: '2 days ago', unread: false },
    { id: 11, kind: 'mention', cat: 'mentions', from: 'Diego R.', text: 'Replied to your comment on "Customer feedback summary"', time: '3 days ago', unread: false },
    { id: 12, kind: 'info', cat: 'all', from: 'Notion', text: 'Page "API integration guide" was edited by Tom Hardy', time: '4 days ago', unread: false }
  ];

  const ICON = {
    info: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><path d="M8 5v3M8 11h.01"/></svg>',
    task: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 8l3 3 7-7"/></svg>',
    alert: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 1l7 13H1L8 1z"/><path d="M8 6v4"/><circle cx="8" cy="12" r="0.5"/></svg>',
    mention: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="3"/><path d="M11 8v1a2 2 0 004 0V8a7 7 0 10-2.7 5.5"/></svg>'
  };

  let filter = 'all';

  function visible() {
    if (filter === 'all') return notifications;
    if (filter === 'unread') return notifications.filter((n) => n.unread);
    return notifications.filter((n) => n.cat === filter);
  }

  function render() {
    const list = document.getElementById('notif-list');
    const empty = document.getElementById('notif-empty');
    const items = visible();
    if (!items.length) {
      list.innerHTML = '';
      empty.hidden = false;
    } else {
      empty.hidden = true;
      list.innerHTML = items.map((n) => `
      <button type="button" class="notification-row${n.unread ? ' unread' : ''}" data-id="${n.id}">
        <span class="notif-icon notif-${n.kind}" aria-hidden="true">${ICON[n.kind] || ICON.info}</span>
        <span class="notif-body">
          <span class="notif-from">${n.from}</span>
          <span class="notif-text">${n.text}</span>
        </span>
        <span class="notif-time">${n.time}</span>
      </button>
    `).join('');
    }
    // Update unread counter
    const unread = notifications.filter((n) => n.unread).length;
    const badge = document.getElementById('count-unread');
    badge.textContent = unread;
    badge.style.display = unread ? '' : 'none';
  }

  document.getElementById('notif-tabs').addEventListener('click', (e) => {
    const btn = e.target.closest('.chart-tab');
    if (!btn) return;
    filter = btn.dataset.filter;
    render();
  });

  document.getElementById('notif-list').addEventListener('click', (e) => {
    const row = e.target.closest('.notification-row');
    if (!row) return;
    const id = parseInt(row.dataset.id, 10);
    const n = notifications.find((x) => x.id === id);
    if (n) n.unread = false;
    render();
  });


  render();


  const notificationModal = document.getElementById("notification-modal");
  const backdrop = document.querySelector('.notify-backdrop')


  document.getElementById("notification-btn").addEventListener("click", () => {
    notificationModal.classList.add("show");
    backdrop.classList.add('show')
  });

  function closeModal() {
    notificationModal.classList.remove("show");
    backdrop.classList.remove('show')
  }

  document.querySelector(".publish-btn")
    .addEventListener("click", closeModal);

  document.querySelector(".cancel-btn")
    .addEventListener("click", closeModal);
</script>

{% endblock %}
